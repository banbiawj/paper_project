<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>记录簿 - 注册</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body, html {
            height: 100%;
            background-color: #ffffff;
            color: #1a1a1a;
            overflow-x: hidden;
        }

        .split-layout {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }

        .layout-left {
            flex: 1.2;
            background: linear-gradient(135deg, #121212 0%, #2a2a2a 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 10%;
            position: relative;
            overflow: hidden;
        }

        .layout-left::before,
        .layout-left::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 70%);
        }

        .layout-left::before {
            top: -20%;
            left: -10%;
            width: 50vw;
            height: 50vw;
        }

        .layout-left::after {
            bottom: -10%;
            right: -10%;
            width: 40vw;
            height: 40vw;
        }

        .brand-showcase {
            position: relative;
            z-index: 2;
        }

        .brand-logo-large {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 40px;
        }

        .brand-slogan {
            font-size: 48px;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 24px;
            letter-spacing: 1px;
        }

        .brand-description {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.6;
            max-width: 80%;
        }

        .layout-right {
            flex: 1;
            max-width: 560px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px 80px;
            background-color: #ffffff;
            box-shadow: -20px 0 40px rgba(0, 0, 0, 0.03);
            z-index: 10;
        }

        .register-wrapper {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }

        .register-header {
            margin-bottom: 40px;
        }

        .register-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #1a1a1a;
        }

        .subtitle {
            font-size: 15px;
            color: #6c757d;
        }

        .form-floating {
            position: relative;
            margin-bottom: 26px;
        }

        .form-floating input {
            width: 100%;
            padding: 24px 0 8px 0;
            font-size: 16px;
            color: #1a1a1a;
            background: transparent;
            border: none;
            border-bottom: 1px solid #dee2e6;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .form-floating input:focus {
            border-bottom-color: #1a1a1a;
        }

        .form-floating label {
            position: absolute;
            left: 0;
            top: 20px;
            color: #6c757d;
            font-size: 16px;
            pointer-events: none;
            transition: all 0.2s ease;
        }

        .form-floating input:focus ~ label,
        .form-floating input:not(:placeholder-shown) ~ label {
            top: 0;
            font-size: 13px;
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background-color: #1a1a1a;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #333333;
            box-shadow: 0 4px 16px rgba(26, 26, 26, 0.2);
            transform: translateY(-1px);
        }

        .register-footer {
            margin-top: 32px;
            font-size: 14px;
            color: #6c757d;
        }

        .register-footer a {
            text-decoration: none;
            color: #1a1a1a;
            font-weight: 600;
            margin-left: 4px;
        }

        .register-error {
            margin-bottom: 24px;
            padding: 12px 14px;
            border-radius: 10px;
            background-color: #fef2f2;
            color: #b91c1c;
            font-size: 14px;
            line-height: 1.5;
        }

        @media (max-width: 992px) {
            .layout-left {
                display: none;
            }

            .layout-right {
                max-width: 100%;
                align-items: center;
                padding: 40px 24px;
                background-color: #f8f9fa;
                box-shadow: none;
            }

            .register-wrapper {
                background: #ffffff;
                padding: 40px;
                border-radius: 16px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            }
        }

        @media (max-width: 480px) {
            .layout-right {
                padding: 16px;
            }

            .register-wrapper {
                padding: 32px 24px;
            }

            .register-title {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>
    <div class="split-layout">
        <div class="layout-left">
            <div class="brand-showcase">
                <div class="brand-logo-large">
                    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="currentColor" viewBox="0 0 16 16">
                        <path d="m13.498.795.149-.149a1.207 1.207 0 1 1 1.707 1.708l-.149.148a1.5 1.5 0 0 1-.059 2.059L4.854 14.854a.5.5 0 0 1-.233.131l-4 1a.5.5 0 0 1-.606-.606l1-4a.5.5 0 0 1 .131-.232l9.642-9.642a.5.5 0 0 0-.642.056L6.854 4.854a.5.5 0 1 1-.708-.708L9.44.854A1.5 1.5 0 0 1 11.5.796a1.5 1.5 0 0 1 1.998-.001zm-.644.766a.5.5 0 0 0-.707 0L1.95 11.756l-.764 3.057 3.057-.764L14.44 3.854a.5.5 0 0 0 0-.708l-1.585-1.585z"/>
                    </svg>
                    <span>记录簿</span>
                </div>
                <h1 class="brand-slogan">开启你的<br>记忆空间。</h1>
                <p class="brand-description">创建普通账号后即可进入记录簿，积累词语、成语与学习笔记。</p>
            </div>
        </div>

        <div class="layout-right">
            <div class="register-wrapper">
                <div class="register-header">
                    <h2 class="register-title">创建账号</h2>
                    <div class="subtitle">填写账号信息完成注册</div>
                </div>

                {% if error %}
                <div class="register-error" role="alert">{{ error }}</div>
                {% endif %}

                <form method="post" action="/register">
                    <div class="form-floating">
                        <input type="text" id="username" name="username" value="{{ username or '' }}" placeholder=" " autocomplete="username" required>
                        <label for="username">账号</label>
                    </div>

                    <div class="form-floating">
                        <input type="email" id="email" name="email" value="{{ email or '' }}" placeholder=" " autocomplete="email" required>
                        <label for="email">邮箱</label>
                    </div>

                    <div class="form-floating">
                        <input type="password" id="password" name="password" placeholder=" " autocomplete="new-password" required>
                        <label for="password">密码</label>
                    </div>

                    <div class="form-floating">
                        <input type="password" id="confirm_password" name="confirm_password" placeholder=" " autocomplete="new-password" required>
                        <label for="confirm_password">确认密码</label>
                    </div>

                    <button type="submit" class="btn-primary">注 册</button>
                </form>

                <div class="register-footer">
                    <span>已有账号？</span>
                    <a href="/login">返回登录</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
